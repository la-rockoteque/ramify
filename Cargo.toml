[package]
name = "ram-code"
version = "0.1.0"
edition = "2021"
description = "Terminal coding harness for Ramify worktrees"
license = "MIT"

[lib]
name = "ram_code"
path = "src/lib.rs"

[[bin]]
name = "ram-code"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
md-5 = "0.10"
libc = "0.2"
regex = "1"
ignore = "0.4.34"
globset = "0.4.21"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "process", "time", "io-util", "sync"] }
sha2 = "0.11.1"
