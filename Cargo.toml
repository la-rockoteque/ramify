[package]
name = "ram-code"
version = "0.1.0"
edition = "2021"
description = "Terminal coding harness for Ramify worktrees"
license = "MIT"

[lib]
name = "ram_code"
path = "src/lib.rs"

[[bin]]
name = "ram-code"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
md-5 = "0.10"
