# ramify — moship. Sourced as bash: single-quote commands so $PORT and $<SERVICE>_PORT
# expand when the service starts, not now. Drafted by 'ramify setup', then refined by hand:
# the shared-API paths, the migrations, the proxy smoke, the QA results path.

# ── Branching ──
# 'ramify new <slug>' cuts story/<slug> from origin/main into ../moship-wt/<slug>.
RAMIFY_MAIN=main
RAMIFY_BRANCH_PREFIX=story/
RAMIFY_WORKTREES=../moship-wt
# Gitignored paths every new worktree needs; git does not bring them.
RAMIFY_COPY=".claude"
RAMIFY_BOOTSTRAP='(cd moship-web && npm install)'
# Exists once the bootstrap is done; the worktree hook waits for it before 'up'.
RAMIFY_READY=moship-web/node_modules/.package-lock.json
# Uncomment to let a branch that is behind main be pushed.
# RAMIFY_GATE_BEHIND=0

# ── QA recipe ──
# The checklist ask-for-qa hands over. <slug> is the worktree name.
RAMIFY_QA_PLAN='docs/stories/*/<slug>/qa-plan.md'
RAMIFY_QA_RESULTS='docs/stories/*/<slug>/qa-results.md'
RAMIFY_QA_NOTES='List screens need data: run the seed-local skill first.'

# ── Shared containers (never stopped by ramify) ──
RAMIFY_COMPOSE_FILE=docker-compose.yml
RAMIFY_CONTAINERS="moship-db moship-blob"

# ── Services, started in this order ──
RAMIFY_SERVICES="api web storybook"

web_port=5173
web_dir=moship-web
web_health=/
web_cmd='VITE_API_TARGET=http://localhost:$API_PORT npm run dev -- --port $PORT'

storybook_port=6006
storybook_dir=moship-web
storybook_health=/index.json
storybook_cmd='npm run storybook -- -p $PORT --no-open'
# Boots last and nothing waits on it; RAMIFY_SKIP=storybook leaves it out.
storybook_optional=1

# Slot N → 5000+N. Slot 0 is never used, and a port someone else holds skips the slot.
api_port=5000
# Check it: the path that answers once the API really serves, not once it logs « listening ».
api_health=/health
api_timeout=180
# --urls, not ASPNETCORE_URLS: the launch profile overrides the environment variable.
# No MSBuild build servers in anything that builds, `api_prepare` included (`dotnet ef` builds
# first): reusable nodes pile up per parallel build and stay 15 minutes. The Roslyn compiler
# server stays on: one per SDK for the whole machine, rebuilds about 2.5x faster.
DOTNET_NO_MSBUILD_SERVERS='MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0'
api_cmd="$DOTNET_NO_MSBUILD_SERVERS "'DOTNET_WATCH_RESTART_ON_RUDE_EDIT=1 dotnet watch --project MoShip.Api --non-interactive run --urls http://localhost:$PORT'
api_shared_port=5100
api_shared_cmd="$DOTNET_NO_MSBUILD_SERVERS "'dotnet run --project MoShip.Api --urls http://localhost:$PORT'
# While every changed path matches, the branch reuses the shared API and skips api_prepare.
api_shared_when='^(moship-web/|docs/|\.omc/)'
api_prepare="$DOTNET_NO_MSBUILD_SERVERS "'dotnet ef database update --project MoShip.Infrastructure --startup-project MoShip.Api'
web_smoke='/api/features 200|401'
